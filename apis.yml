aid: matchstick-ventures
name: Matchstick Ventures
description: 'Matchstick Ventures is an early-stage venture capital fund investing
  across the North and Rockies (the Upper Midwest and Mountain West). The firm backs
  seed and pre-seed founders where innovative ideas, large markets, and diverse "underdog"
  founders intersect, describing itself as a catalyst for its founders, partners, and
  regional startup communities. Its portfolio spans consumer, commerce, developer,
  and B2B software companies including Soona, StackHawk, Spekit, Branch, Inspectorio,
  Airspace Link, Fiveable, Parallax, River, Tilt, Base, Ordermark, and Upsie.'
